apiVersion: thinkube.io/v1
kind: ThinkubeDeployment
metadata:
  # The application's version; the generated app starts at it.
  version: "0.1.0"

spec:
  deployment:
    type: component
    name: transformers
    replicas: 0
    # Pods are created per node by the LLM gateway when a model is loaded, so
    # resting at zero replicas is idle rather than disabled.
    gateway_managed: true

  # The LLM gateway serves speech-to-text, text-to-image and text-to-speech
  # models on this component: one pod per model, copied from the inference
  # container's Deployment.
  llm_backend:
    type: transformers
    display_name: Transformers
    container: inference
    driver: per-model-pod
    tier: performance

  containers:
    - name: inference
      build: .
      port: 8000
      size: xlarge
      gpu:
        count: 1
        memory: "16Gi"
      health: /health
      # The server opens its port once the model is loaded from Thinkube
      # Storage.
      startupSeconds: 1200
      test:
        enabled: false
